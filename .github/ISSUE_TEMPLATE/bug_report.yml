name: "Ошибка / Problem"
description: "Ошибка установщика, игры или сервера / Installer, game or server problem"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Опишите проблему по-русски или по-английски. Перед отправкой проверьте журналы на частные данные.
        English reports are welcome. Review logs for private information before attaching them.
  - type: dropdown
    id: where
    attributes:
      label: "Где проблема? / Where is the problem?"
      options:
        - "Установщик / Installer"
        - "В игре / In the game"
        - "Сервер / Server"
        - "Другое / Other"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "Что случилось? / What happened?"
      description: "Что делали, что ожидали и что получилось. / Steps, expected result and actual result."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Версия OG Coop / OG Coop version"
      description: "J > Настройки > О дополнении, первая строка установщика или название выпуска. / J > Settings > About, the installer's first line or release name."
      placeholder: "0.4.3"
  - type: dropdown
    id: platform
    attributes:
      label: "Игра / Game"
      options:
        - "Rockstar Games Launcher"
        - "Steam"
        - "Epic Games"
        - "VK Play"
        - "Другое / Other"
  - type: textarea
    id: logs
    attributes:
      label: "Журналы / Logs"
      description: |
        Перетащите проверенные файлы сюда. / Attach reviewed files here.
        - Установщик / installer: install-log.txt рядом с Install.exe / next to Install.exe
        - Игра / game: scripts/RageCoop/Data/RageCoop.Client.log в папке GTA / in the GTA folder
        - Сервер / server: текст окна сервера / text from the server window
